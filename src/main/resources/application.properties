# Server Port
server.port=8080

# MySQL Configuration (Linux-specific settings included)

# createDatabaseIfNotExist=true ensures the DB is created if you missed the manual step.
# useSSL=false & allowPublicKeyRetrieval=true prevent common Linux connection errors.
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Siliguri@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate Configuration

# 'update' automatically creates/modifies tables based on your User.java entity.
spring.jpa.hibernate.ddl-auto=update 

# Shows the SQL in your console (Great for debugging 500 errors)
spring.jpa.show-sql=true

# MySQL8Dialect is the most stable version for modern Linux MySQL installs.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Security & Logging (Optional)

# If you get a 403, uncomment the line below to see exactly why Spring blocked the request.
# logging.level.org.springframework.security=DEBUG